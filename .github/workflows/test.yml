name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        go-version: ["1.22", "1.23", "1.24", "1.25"]
    
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
    - name: Start OTLP Collector
      run: |
        docker run -d --name otel-collector -p 4318:4318 otel/opentelemetry-collector:latest

    - name: Set up Go
      uses: actions/setup-go@19bb51245e9c80abacb2e91cc42b33fa478b8639 # v4.2.1
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Cache Go modules
      uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Build
      run: go build -v ./...
    
    - name: Run tests
      run: go test -v ./...
        
    - name: Vet
      run: go vet ./...
    
    - name: Format check
      run: |
        gofmt -s -d .
        if [ "$(gofmt -s -d . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted correctly. Please run 'go fmt ./...'"
          exit 1
        fi
