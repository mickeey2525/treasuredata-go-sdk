version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: tdcli
    main: ./cmd/tdcli
    binary: tdcli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: tdcli
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^style:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: mickeey2525
    name: treasuredata-go-sdk
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## Treasure Data Go SDK CLI v{{ .Version }}

    ### Installation

    #### Download binaries
    Download the appropriate binary for your platform from the assets below.

    #### Install via Go
    ```bash
    go install github.com/mickeey2525/treasuredata-go-sdk/cmd/tdcli@{{ .Tag }}
    ```


homebrew_casks:
  - name: tdcli
    repository:
      owner: mickeey2525
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: mickeey2525
      email: mickeey2525@users.noreply.github.com
    commit_msg_template: "Cask update for {{ .ProjectName }} version {{ .Tag }}"
    description: "Treasure Data CLI tool - A comprehensive command-line interface for Treasure Data"
    homepage: "https://github.com/mickeey2525/treasuredata-go-sdk"
    license: "MIT"
    binaries:
      - tdcli
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tdcli"]
          end
