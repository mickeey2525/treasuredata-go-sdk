# OpenTelemetry Collector configuration for tdcli integration
# This configuration receives OTLP data and exports to multiple backends

receivers:
  # OTLP receiver for traces and metrics
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

  # Health check receiver
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  # Batch processor for better performance
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Resource processor to add/modify resource attributes
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
      - key: service.namespace
        value: treasure-data
        action: upsert
      - key: collector.version
        value: 0.88.0
        action: upsert

  # Memory limiter to prevent OOM
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s

  # Sampling processor for traces
  probabilistic_sampler:
    sampling_percentage: 10.0

  # Attributes processor for span/metric modification
  attributes:
    actions:
      # Remove sensitive information
      - key: http.request.header.authorization
        action: delete
      - key: db.statement
        action: update
        from_attribute: db.statement.sanitized
      # Add custom attributes
      - key: tdcli.version
        value: "1.0.0"
        action: upsert

exporters:
  # Jaeger exporter
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # Prometheus exporter for metrics
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: tdcli
    const_labels:
      environment: production

  # OTLP exporter for forwarding to other collectors
  otlp/downstream:
    endpoint: downstream-collector:4317
    tls:
      insecure: true

  # Logging exporter for debugging
  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 200

  # File exporter for backup/debugging
  file:
    path: /tmp/otel-traces.json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiler
  pprof:
    endpoint: 0.0.0.0:1777

  # Memory ballast for stable memory usage
  memory_ballast:
    size_mib: 64

service:
  extensions: [health_check, pprof, memory_ballast]
  
  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, probabilistic_sampler, batch]
      exporters: [jaeger, otlp/downstream, logging]

    # Metrics pipeline  
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, logging]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888

# Usage with Docker:
# docker run -p 4317:4317 -p 4318:4318 -p 8889:8889 -p 13133:13133 \
#   -v $(pwd)/otel-collector.yaml:/etc/otel-collector.yaml \
#   otel/opentelemetry-collector-contrib:latest \
#   --config=/etc/otel-collector.yaml
